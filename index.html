.total{font-size:12px;color:#b8ddd6}

 border:0;
 border-radius:14px;

 inset:0;
 background:#000b;
 z-index:10;
 padding:15px;
 align-items:end;

 border:1px solid #7ce8d7;
 border-radius:23px;
 padding:20px;
